<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry Form | Bean & Bake Café</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="container nav-container">
            <div class="logo">
                <a href="index.html">Bean & Bake <span>Café</span></a>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="enquiry.html" class="active">Enquiry</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="container intro">
            <h2>Custom Order & General Enquiry</h2>
            <p>Please fill out the form below to request custom cakes or ask general questions.</p>
        </section>

        <section class="container" style="max-width: 600px; padding-bottom: 3rem;">
            <form id="enquiryForm" style="background-color: var(--bg-beige); padding: 2rem; border-radius: 8px;">
                
                <div style="margin-bottom: 1rem;">
                    <label for="fullName" style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Full Name *</label>
                    <input type="text" id="fullName" name="fullName" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="email" style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Email Address *</label>
                    <input type="email" id="email" name="email" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="phone" style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Phone Number *</label>
                    <input type="tel" id="phone" name="phone" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="enquiryType" style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Enquiry Type *</label>
                    <select id="enquiryType" name="enquiryType" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;">
                        <option value="">-- Select Type --</option>
                        <option value="custom-cake">Custom Cake Request</option>
                        <option value="bulk-order">Bulk Bakery Order</option>
                        <option value="general">General Question</option>
                    </select>
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="message" style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Message / Order Details *</label>
                    <textarea id="message" name="message" rows="5" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;"></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; border: none; cursor: pointer;">Submit Enquiry</button>

                <p id="formStatus" style="margin-top: 1rem; text-align: center; font-weight: bold;"></p>
            </form>
        </section>
    </main>

    <footer>
        <div class="container footer-content">
            <p>&copy; 2026 Bean & Bake Café. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
